<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saturday Planner</title>
<style>
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#fafafa; color:#222; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:#666; margin:0 0 20px; }
  .box { background:#fff; border:1px solid #e3e3e3; border-radius:8px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  label span { font-weight:400; color:#888; }
  input, textarea { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid #d6d6d6; border-radius:6px; font:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  button { padding:10px 18px; border:0; border-radius:6px; background:#222; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:none; color:#222; border:1px solid #ccc; }
  .actions { margin-top:16px; display:flex; gap:10px; }
  .stages { list-style:none; padding:0; margin:0; }
  .stages li { padding:6px 0; color:#888; } .stages li.done { color:#222; } .stages li.done::before { content:"✓ "; color:#16a34a; }
  .stages li.now { color:#222; font-weight:600; } .stages li.now::before { content:"… "; }
  .q { margin:6px 0; padding-left:14px; border-left:3px solid #f59e0b; }
  .err { color:#b91c1c; }
  .facts { color:#555; font-size:14px; margin:4px 0 14px; }
  .stop { padding:12px 0; border-top:1px solid #eee; display:grid; grid-template-columns:90px 1fr; gap:10px; }
  .t { font-weight:700; font-variant-numeric:tabular-nums; } .t small { display:block; font-weight:400; color:#888; }
  .stop h3 { margin:0; font-size:16px; } .stop h3 a { color:inherit; }
  .meta { font-size:13px; color:#777; } .why { margin:4px 0 0; }
  .tip { font-size:13px; color:#555; margin-top:2px; }
  .leg { font-size:13px; color:#888; padding:4px 0 4px 100px; }
  ul.notes { margin:6px 0 0; padding-left:18px; }
  details { margin-top:14px; } summary { cursor:pointer; font-weight:600; }
  .ev { border-top:1px solid #eee; padding:8px 0; font-size:13px; }
  .ev b { font-size:14px; } .ev .in { color:#777; } .ev ul { margin:4px 0; padding-left:18px; }
  .ev .tools { color:#6b21a8; font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  [hidden] { display:none !important; }
  /* timeline */
  .flow { margin-top:18px; }
  .node, .edge { display:grid; grid-template-columns:36px 1fr; column-gap:14px; }
  .rail { position:relative; display:flex; justify-content:center; }
  .badge { position:relative; z-index:1; width:30px; height:30px; margin-top:12px; border-radius:50%; background:#1a73e8; color:#fff;
           font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 4px #fff, 0 1px 3px rgba(0,0,0,.25); }
  .badge.start { background:#fff; border:3px solid #1a73e8; width:24px; height:24px; }
  .badge.end { background:#fff; border:3px solid #188038; width:24px; height:24px; }
  .node .rail::after { content:""; position:absolute; top:0; bottom:0; width:0; border-left:3px solid #e3e3e3; }
  .node.first .rail::after { top:24px; } .node.last .rail::after { bottom:calc(100% - 24px); }
  .card { background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:10px 14px; margin:4px 0; }
  .card .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .card .when { font-size:13px; color:#1a73e8; font-weight:600; font-variant-numeric:tabular-nums; }
  .card .dur { font-size:12px; color:#888; }
  .card h3 { margin:2px 0 2px; font-size:16px; } .card h3 a { color:inherit; text-decoration:none; } .card h3 a:hover { color:#1a73e8; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 2px; }
  .chip { font-size:12px; background:#f1f3f4; color:#444; border-radius:999px; padding:1px 9px; }
  .chip.meal { background:#fef3e2; color:#b06000; } .chip.web { background:#e6f4ea; color:#137333; }
  .edge .rail::after { content:""; position:absolute; top:0; bottom:0; width:0; border-left:3px solid var(--c, #ccc); }
  .edge .rail.walk::after { border-left-style:dotted; }
  .edge .leg-row { display:flex; align-items:center; min-height:42px; }
  .pill { display:inline-flex; gap:6px; align-items:center; font-size:13px; background:#fff; border:1px solid var(--c, #ddd);
          border-radius:999px; padding:3px 11px; color:#333; }
  .pill b { color:var(--c, #333); font-weight:600; }
  .summary-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="intro"><h1>Saturday Planner</h1>
  <p class="sub">Tell me where you are, who's coming, how long you have and what you like — I'll plan the route.</p></header>

  <!-- 1. input -->
  <section id="v-form">
    <div class="box">
      <label>Describe your Saturday <span>(free text — optional if you fill the form)</span></label>
      <textarea id="text" placeholder="e.g. Two of us in Indiranagar, free from 4 PM for about 5 hours. We love quiet cafes, lakes and some live music."></textarea>
      <div class="grid">
        <div><label>City</label><input id="city" placeholder="Bangalore"></div>
        <div><label>Area / starting point</label><input id="area" placeholder="Indiranagar"></div>
        <div><label>Number of people</label><input id="group_size" type="number" min="1" placeholder="2"></div>
        <div><label>Time available <span>(default: full day)</span></label><input id="available_time" placeholder="full day"></div>
        <div><label>Start time <span>(default: 10 AM)</span></label><input id="start_time" type="time"></div>
        <div><label>Budget ₹ <span>(optional)</span></label><input id="budget" type="number" placeholder="no limit"></div>
      </div>
      <label>Kinds of places you'd like</label><input id="interests" placeholder="cafes, lakes, live music, museums…">
      <label>Anything to avoid or keep in mind <span>(optional)</span></label><input id="constraints" placeholder="vegetarian, avoid crowds…">
      <div class="actions"><button id="go">Plan my Saturday</button></div>
    </div>
  </section>

  <!-- 2. clarify -->
  <section id="v-ask" hidden>
    <div class="box">
      <b>A couple of things before I plan:</b>
      <div id="questions"></div>
      <label>Your answer</label>
      <textarea id="answer" placeholder="Answer here…"></textarea>
      <div class="actions"><button id="answer-go">Continue</button><button class="ghost" id="ask-back">Edit my request</button></div>
    </div>
  </section>

  <!-- 3. progress -->
  <section id="v-progress" hidden>
    <div class="box"><ul class="stages" id="stages"></ul></div>
  </section>

  <!-- 4. result -->
  <section id="v-result" hidden>
    <div class="box" id="plan"></div>
    <div class="actions"><button id="again">Plan another Saturday</button></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtT = iso => new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const MODE = {walk:"walk", cab:"cab", auto:"auto", drive:"drive", metro:"metro", bus:"bus"};
const FIELDS = ["city","area","group_size","available_time","start_time","budget","interests","constraints"];
let extraText = "", traceEvents = [], gotFinal = false, runRef = "";

function show(v) {
  ["form","ask","progress","result"].forEach(x => $("v-" + x).hidden = x !== v);
  $("intro").hidden = v !== "form";
  window.scrollTo(0, 0);
}

function collect() {
  const form = {};
  FIELDS.forEach(k => { const v = $(k).value.trim(); if (v) form[k] = v; });
  if (form.group_size) form.group_size = Number(form.group_size);
  if (form.budget) form.budget = Number(form.budget);
  return form;
}

async function submit() {
  const text = [$("text").value.trim(), extraText].filter(Boolean).join("\n\n");
  if (!text && !Object.keys(collect()).length) { $("text").focus(); return; }
  traceEvents = []; gotFinal = false; runRef = ""; $("stages").innerHTML = ""; show("progress");
  try {
    const res = await fetch("/api/plan", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({form: collect(), text})});
    if (!res.ok) {  // rate limit / busy / validation errors come back as plain JSON
      let msg = "The planner couldn't take this request right now. Please try again.";
      try { const j = await res.json(); msg = j.error || (res.status === 422 ? "Your description is too long — please shorten it." : msg); } catch (_) {}
      fail(msg); return;
    }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true}); let i;
      while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) handle(JSON.parse(line)); }
    }
    if (!gotFinal) fail("The connection dropped before the plan was ready. Please try again.");
  } catch (e) { fail("Couldn't reach the planner — check your connection and try again."); }
}

function handle(m) {
  if (["clarify", "error", "result"].includes(m.type)) gotFinal = true;
  if (m.type === "run") { runRef = m.ref; return; }
  if (m.type === "stage") {
    [...$("stages").children].forEach(li => { li.className = "done"; });
    const li = document.createElement("li"); li.className = "now"; li.textContent = m.label; $("stages").appendChild(li);
  } else if (m.type === "trace") traceEvents.push(m.event);
  else if (m.type === "clarify") {
    $("questions").innerHTML = m.questions.map(q => `<p class="q">${esc(q)}</p>`).join("");
    $("answer").value = ""; show("ask"); $("answer").focus();
    window._lastQuestions = m.questions;
  } else if (m.type === "error") fail(m.message, m.ref);
  else if (m.type === "result") render(m.data);
}

function fail(msg, ref) {
  ref = ref || runRef;
  $("plan").innerHTML = `<p class="err" style="margin:0">${esc(msg)}</p>` +
    (ref ? `<p class="meta" style="margin:6px 0 0">Reference: ${esc(ref)}</p>` : "") + traceHtml();
  show("result");
}

$("go").onclick = () => { extraText = ""; submit(); };
$("answer-go").onclick = () => {
  const a = $("answer").value.trim(); if (!a) return;
  extraText += `\nAnswers to your questions (${(window._lastQuestions || []).join(" | ")}): ${a}`;
  submit();
};
$("ask-back").onclick = () => show("form");
$("again").onclick = () => { extraText = ""; show("form"); };

function traceHtml() {
  if (!traceEvents.length) return "";
  return `<details><summary>What the agent did</summary>${traceEvents.map(e => `
    <div class="ev"><b>${esc(e.step)}</b> ${e.input ? `<span class="in">— ${esc(e.input)}</span>` : ""}
      <div>${esc(e.output)}</div>
      ${e.decisions?.length ? `<ul>${e.decisions.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
    </div>`).join("")}</details>`;
}

const MODE_ICON = {walk:"🚶 Walk", auto:"🛺 Auto", cab:"🚕 Cab", metro:"🚇 Metro", bus:"🚌 Bus", drive:"🚗 Drive"};
const MODE_COLOR = {walk:"#5f6368", auto:"#188038", cab:"#1a73e8", metro:"#9334e6", bus:"#e37400", drive:"#1a73e8"};
const SLOT = {breakfast:"Breakfast", lunch:"Lunch", snack:"Snack", dinner:"Dinner"};
const mins = (a, b) => Math.round((new Date(b) - new Date(a)) / 60000);
const dur = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`;

function flowHtml(p, d) {
  const n = p.stops.length;
  let h = `<div class="node first"><div class="rail"><div class="badge start"></div></div>
    <div class="card"><div class="when">Start · ${fmtT(p.stops[0].leg_in?.depart || p.stops[0].arrive)}</div><h3>${esc(d.context.place)}</h3></div></div>`;
  p.stops.forEach((s, i) => {
    const pl = s.place, leg = s.leg_in, c = MODE_COLOR[leg?.mode] || "#ccc";
    if (leg) h += `<div class="edge" style="--c:${c}"><div class="rail ${leg.mode === "walk" ? "walk" : ""}"></div>
      <div class="leg-row"><span class="pill"><b>${MODE_ICON[leg.mode] || leg.mode}</b> ${dur(leg.minutes)}${leg.km ? ` · ${leg.km.toFixed(1)} km` : ""}${leg.cost ? ` · ~${inr(leg.cost)}` : " · free"}</span></div></div>`;
    const chips = [SLOT[s.slot_type] ? `<span class="chip meal">${SLOT[s.slot_type]}</span>` : "",
      pl.rating ? `<span class="chip">★ ${pl.rating}</span>` : "",
      `<span class="chip">${inr(s.cost_min)}–${inr(s.cost_max)}</span>`,
      pl.web_mentions ? `<span class="chip web">Recommended online</span>` : ""].join("");
    h += `<div class="node ${i === n - 1 ? "last" : ""}"><div class="rail"><div class="badge">${i + 1}</div></div><div class="card">
      <div class="top"><span class="when">${fmtT(s.start)} – ${fmtT(s.depart)}</span><span class="dur">${dur(mins(s.start, s.depart))}</span></div>
      <h3><a href="${esc(pl.maps_url)}" target="_blank" rel="noopener">${esc(pl.name)}</a></h3>
      <div class="chips">${chips}</div>
      ${s.reason ? `<p class="why">${esc(s.reason)}</p>` : ""}
      ${s.tip ? `<div class="tip">💡 ${esc(s.tip)}</div>` : ""}
    </div></div>`;
  });
  return `<div class="flow">${h}</div>`;
}

function render(d) {
  const p = d.plan, prof = d.profile;
  const notes = [...(p.tradeoffs || []), ...(p.tips || []), ...(prof.assumptions || [])];
  $("plan").innerHTML = `
    <h2 style="margin:0">${esc(p.title)}</h2>
    <div class="summary-row">
      <span class="chip">${p.stops.length} stops</span>
      <span class="chip">${fmtT(p.stops[0].start)} – ${fmtT(p.stops[p.stops.length - 1].depart)}</span>
      <span class="chip">${dur(p.travel_minutes)} travel</span>
      <span class="chip">${inr(p.cost_min)}–${inr(p.cost_max)}${prof.budget ? ` of ${inr(prof.budget)}` : ""} for ${prof.group_size}</span>
    </div>
    ${flowHtml(p, d)}
    ${notes.length ? `<div style="margin-top:18px"><b>Good to know</b><ul class="notes">${notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${d.alternatives?.length ? `<details><summary>Other options</summary>${d.alternatives.map((a, i) =>
        `<p>${i + 1}. ${a.stops.map(s => `${fmtT(s.start)} ${esc(s.place.name)}`).join(" → ")} · ${inr(a.cost_min)}–${inr(a.cost_max)}</p>`).join("")}</details>` : ""}
    ${traceHtml()}`;
  show("result");
}
</script>
</body>
</html>
